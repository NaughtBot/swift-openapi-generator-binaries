name: Release binaries

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Upstream release tag to build, for example 1.12.2. Leave blank to discover missing releases."
        required: false
        type: string
      max_releases:
        description: "Maximum missing upstream releases to build during discovery."
        required: false
        default: "10"
        type: string
      include_prereleases:
        description: "Include upstream prereleases during discovery."
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  UPSTREAM_REPOSITORY: apple/swift-openapi-generator
  UPSTREAM_URL: https://github.com/apple/swift-openapi-generator.git
  # This distribution repository starts tracking upstream releases at the
  # release current when it was created. Manual runs can still build older tags.
  MIN_UPSTREAM_VERSION: "1.12.2"

jobs:
  discover:
    name: Discover releases
    runs-on: ubuntu-24.04
    outputs:
      has_releases: ${{ steps.discover.outputs.has_releases }}
      versions: ${{ steps.discover.outputs.versions }}
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Discover upstream releases
        id: discover
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version || '' }}
          MAX_RELEASES: ${{ inputs.max_releases || '10' }}
          INCLUDE_PRERELEASES: ${{ inputs.include_prereleases || 'false' }}
        run: scripts/discover-releases.sh

  build-darwin:
    name: Build ${{ matrix.version }} darwin-arm64
    needs: discover
    if: needs.discover.outputs.has_releases == 'true'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.discover.outputs.versions) }}
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Show Swift version
        run: swift --version

      - name: Build and package
        env:
          VERSION: ${{ matrix.version }}
          PLATFORM: darwin-arm64
          DEB_ARCH: ""
        run: scripts/build-release.sh "$VERSION" "$PLATFORM" "$DEB_ARCH"

      - name: Upload packaged assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-assets-${{ matrix.version }}-darwin-arm64
          path: dist/*
          if-no-files-found: error

  build-linux:
    name: Build ${{ matrix.version }} ${{ matrix.target.platform }}
    needs: discover
    if: needs.discover.outputs.has_releases == 'true'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.discover.outputs.versions) }}
        target:
          - platform: linux-x86_64
            runner: ubuntu-22.04
            deb_arch: amd64
          - platform: linux-aarch64
            runner: ubuntu-22.04-arm
            deb_arch: arm64
    runs-on: ${{ matrix.target.runner }}
    container:
      image: docker.io/library/swift:6.1.3-jammy@sha256:faa16c1b31fa66261d475d296e1d94cf7fe99ad4b6b1bb49ade0d6769812acda
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Show tool versions
        run: |
          swift --version
          git --version
          dpkg-deb --version

      - name: Build and package
        env:
          VERSION: ${{ matrix.version }}
          PLATFORM: ${{ matrix.target.platform }}
          DEB_ARCH: ${{ matrix.target.deb_arch }}
        run: scripts/build-release.sh "$VERSION" "$PLATFORM" "$DEB_ARCH"

      - name: Upload packaged assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-assets-${{ matrix.version }}-${{ matrix.target.platform }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish ${{ matrix.version }}
    needs:
      - discover
      - build-darwin
      - build-linux
    if: needs.discover.outputs.has_releases == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.discover.outputs.versions) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Download packaged assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: release-assets-${{ matrix.version }}-*
          path: downloaded-assets
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ matrix.version }}
        run: scripts/publish-release.sh "$VERSION" downloaded-assets
